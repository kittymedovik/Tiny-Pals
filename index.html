<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tiny Wins Club</title>
<meta name="theme-color" content="#5ED3A8">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tiny Wins"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one-column phone app. Day/night scene hero with live clock, big tap rows, fixed 5-tab bar. Tokens from real-life wins play games; games pay gems; gems buy pals. */
:root{
  --bg:#E8F5F0; --surface:#FFFFFF; --surface2:#F1FAF6; --ink:#1E3A36; --muted:#587570; --line:#CDE3DB;
  --accent:#FF7A9A; --mint:#5ED3A8; --sky:#7CC4F5; --butter:#FFD66B; --bad:#D9455F; --good:#1B8D66;
  --on-fill:#16302B; --gem:#9B7CFF; --shadow:0 3px 0 rgba(30,58,54,.10);
  --rc0:#6F8A84; --rc1:#2F86D6; --rc2:#8A5CE0; --rc3:#C98A00; --rc4:#D6407A;
  --f-display:'Fredoka','Nunito',system-ui,sans-serif; --f-body:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A18; --surface:#172725; --surface2:#1D3330; --ink:#E4F4EE; --muted:#93B3AB; --line:#2A4540;
  --accent:#FF8AA6; --mint:#4CC79B; --sky:#6DB8EF; --butter:#F2C85B; --bad:#FF8296; --good:#4CCB9D;
  --gem:#B79CFF; --shadow:0 3px 0 rgba(0,0,0,.35);
  --rc0:#8FA9A3; --rc1:#6DB8EF; --rc2:#B79CFF; --rc3:#F5C451; --rc4:#FF8AB0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A18; --surface:#172725; --surface2:#1D3330; --ink:#E4F4EE; --muted:#93B3AB; --line:#2A4540;
  --accent:#FF8AA6; --mint:#4CC79B; --sky:#6DB8EF; --butter:#F2C85B; --bad:#FF8296; --good:#4CCB9D;
  --gem:#B79CFF; --shadow:0 3px 0 rgba(0,0,0,.35);
  --rc0:#8FA9A3; --rc1:#6DB8EF; --rc2:#B79CFF; --rc3:#F5C451; --rc4:#FF8AB0; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.45 var(--f-body);
  padding-block:8px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:24px;font-weight:700} h2{font-size:19px;font-weight:600} h3{font-size:16px;font-weight:600}
p{margin:0}
.wrap{max-width:520px;margin:0 auto;position:relative;z-index:1}
.muted{color:var(--muted)} .small{font-size:13px}
.stack{display:grid;gap:14px} .gap8{display:grid;gap:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.card>h2{margin-bottom:10px}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bgfx i{position:absolute;border-radius:50%;background:var(--mint);opacity:.10;animation:drift 22s ease-in-out infinite}
.bgfx i:nth-child(2n){background:var(--accent);opacity:.08;animation-duration:28s}
.bgfx i:nth-child(3n){background:var(--sky);opacity:.10;animation-duration:34s}
@keyframes drift{50%{transform:translate(24px,-36px) scale(1.15)}}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:6px 0 10px}
.top .ib{display:flex;gap:8px}
#clock{font:600 14px var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font:600 16px var(--f-display);font-variant-numeric:tabular-nums}
.chip svg{width:20px;height:20px;flex:none}

.btn{font:600 16px var(--f-display);border:0;border-radius:16px;padding:12px 18px;min-height:48px;background:var(--accent);color:var(--on-fill);box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.alt{background:var(--surface2);border:2px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.mint{background:var(--mint)} .btn.butter{background:var(--butter)} .btn.sky{background:var(--sky)} .btn.gemb{background:var(--gem)}
.btn.big{width:100%;font-size:18px;min-height:54px}
.btn.sm{min-height:40px;padding:8px 14px;font-size:15px;border-radius:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.icon-btn{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none;color:var(--muted)}
.icon-btn svg{width:20px;height:20px}
.icon-btn[aria-pressed=true]{color:var(--on-fill);background:var(--mint);border-color:var(--mint)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

input[type=text],input[type=number],input[type=date],textarea{width:100%;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;min-height:48px}
textarea{min-height:90px;font:600 12px/1.3 ui-monospace,Menlo,monospace;resize:vertical}
input::placeholder{color:var(--muted);opacity:.8}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.picks{display:flex;gap:8px;flex-wrap:wrap}
.pk{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:44px;font:600 15px var(--f-display);cursor:pointer}
.pk small{display:block;font:600 11px var(--f-display);color:var(--muted);line-height:1}
.pk[aria-pressed=true]{background:var(--mint);border-color:var(--mint);color:var(--on-fill)}
.pk[aria-pressed=true] small{color:var(--on-fill)}
.lab{font:600 13px var(--f-display);color:var(--muted);letter-spacing:.04em}

.bar{height:14px;border-radius:99px;background:var(--surface2);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .4s}
.bar.gemb i{background:var(--gem)}

/* scene hero */
.scene{position:relative;border-radius:24px;overflow:hidden;border:2px solid var(--line);box-shadow:var(--shadow);background:#9ad7f7}
.scene svg.sky{display:block;width:100%;height:auto}
.scene .who{position:absolute;left:50%;bottom:2px;width:34%;transform:translateX(-50%)}
.scene .say{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.scene .bub{background:rgba(255,255,255,.88);color:#1E3A36;border-radius:14px;padding:6px 11px;font:600 13px var(--f-display);max-width:62%}
.scene .lv{background:rgba(22,48,43,.72);color:#fff;border-radius:12px;padding:4px 10px;font:600 13px var(--f-display);white-space:nowrap}
.cloud{animation:cl 40s linear infinite}
@keyframes cl{from{transform:translateX(-30px)}to{transform:translateX(330px)}}
.twk{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.pet{width:100%} .pet svg{display:block;width:100%;height:auto;overflow:visible}
.bob{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.sil *{fill:var(--line)!important;stroke:var(--line)!important}
.lvl{font:600 14px var(--f-display);color:var(--muted)}

/* week strip */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:2px solid var(--line);background:var(--surface2);border-radius:14px;padding:6px 0 7px;text-align:center;cursor:pointer;min-width:0;display:grid;gap:2px;justify-items:center}
.wd b{font:600 17px var(--f-display);line-height:1}
.wd span{font:600 11px var(--f-display);color:var(--muted)}
.wd i{width:8px;height:8px;border-radius:50%;background:transparent;border:2px solid var(--line)}
.wd i.l1{background:var(--butter);border-color:var(--butter)} .wd i.l2{background:var(--mint);border-color:var(--mint)}
.wd.now{background:var(--butter);border-color:var(--butter);color:var(--on-fill)} .wd.now span{color:var(--on-fill)}

/* tasks */
.task{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:18px;background:var(--surface2);border:2px solid var(--line)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.check{width:34px;height:34px;border-radius:11px;border:3px solid var(--muted);background:var(--surface);flex:none;cursor:pointer;display:grid;place-items:center;padding:0}
.check svg{width:20px;height:20px;opacity:0;stroke:var(--on-fill)}
.check[aria-checked=true]{background:var(--mint);border-color:var(--mint)} .check[aria-checked=true] svg{opacity:1}
.tt{overflow-wrap:anywhere}
.tag{font:600 12px var(--f-display);background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tag svg{width:12px;height:12px}
.stars{display:inline-flex;gap:1px} .stars svg{width:13px;height:13px}
.next{background:var(--butter);border-color:var(--butter);color:var(--on-fill)}
.next .tag{border-color:transparent;color:var(--on-fill);background:rgba(255,255,255,.55)}
.next h2{font-size:21px}
.next .btn.alt{background:rgba(255,255,255,.6);border-color:transparent;color:var(--on-fill)}
.next .label{font:600 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.quest{display:flex;align-items:center;gap:12px}
.quest .bar{flex:1;height:12px}
.coinTag{display:inline-flex;align-items:center;gap:4px;font:600 14px var(--f-display);white-space:nowrap}
.coinTag svg{width:16px;height:16px}
.dow{display:flex;gap:6px;flex-wrap:wrap}
.dow .pk{min-height:40px;padding:6px 0;width:42px;text-align:center}

/* timer */
.ring{position:relative;width:min(280px,74vw);aspect-ratio:1;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tx{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.ring .tm{font:600 56px var(--f-display);font-variant-numeric:tabular-nums;line-height:1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface2);border:2px solid var(--line);border-radius:16px;padding:4px}
.sg button{border:0;background:none;border-radius:12px;min-height:40px;font:600 15px var(--f-display);color:var(--muted);cursor:pointer}
.sg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* chart */
.chart{position:relative;height:150px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;padding-top:20px}
.col{display:grid;grid-template-rows:1fr auto;height:100%;text-align:center;min-width:0}
.col .tr{display:flex;align-items:flex-end;justify-content:center;position:relative}
.col .b{width:100%;max-width:34px;border-radius:10px 10px 4px 4px;background:var(--mint);position:relative;min-height:6px}
.col .b.over{background:var(--bad)} .col .b.none{background:transparent;border:2px dashed var(--line)}
.col .v{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:600 11px var(--f-display);color:var(--muted);white-space:nowrap;margin-bottom:2px}
.col .l{font:600 12px var(--f-display);color:var(--muted);padding-top:4px}
.goalline{position:absolute;left:0;right:0;border-top:2px dashed var(--accent);pointer-events:none}
.goalline span{position:absolute;right:0;top:-18px;font:600 11px var(--f-display);color:var(--muted);background:var(--surface);padding:0 4px}

/* play */
.bal{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bal .big{font:700 34px var(--f-display);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.bal .big svg{width:32px;height:32px}
.game{display:grid;gap:12px}
.game svg.art{width:100%;max-width:260px;height:auto;margin:0 auto;display:block}
.msg{min-height:24px;text-align:center;font:600 16px var(--f-display)}
details{border-top:2px solid var(--line);padding-top:8px}
summary{cursor:pointer;font:600 14px var(--f-display);color:var(--muted);min-height:32px;display:flex;align-items:center}
details ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gt{display:grid;gap:6px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:12px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);min-width:0;align-content:start}
.gt .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--tint);color:var(--on-fill)}
.gt .ic svg{width:26px;height:26px}
.gt b{font:600 16px var(--f-display)} .gt span.d{font-size:12px;color:var(--muted);line-height:1.3}
.reels{display:flex;gap:10px;justify-content:center}
.reel{width:80px;height:80px;border-radius:20px;background:var(--surface2);border:3px solid var(--line);display:grid;place-items:center}
.reel svg{width:46px;height:46px}
.reel.stop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.12)}}
#wheel{transform-origin:0 0}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{aspect-ratio:1;border-radius:16px;border:3px solid var(--line);display:grid;place-items:center;font:700 22px var(--f-display);background:repeating-linear-gradient(45deg,var(--line),var(--line) 6px,var(--surface2) 6px,var(--surface2) 12px);color:var(--muted);cursor:pointer;padding:0}
.st.rev{background:var(--surface2);cursor:default;color:var(--ink)}
.st.win{background:var(--mint);border-color:var(--mint);color:var(--on-fill)}
.st span{display:flex;align-items:center;gap:4px;font-size:20px} .st svg{width:22px;height:22px}
.pcard{width:120px;aspect-ratio:3/4;margin:0 auto;border-radius:18px;background:var(--surface);border:3px solid var(--ink);display:grid;place-content:center;gap:2px;text-align:center;box-shadow:var(--shadow)}
.pcard b{font:700 52px var(--f-display);line-height:1} .pcard svg{width:34px;height:34px;margin:0 auto}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pc{aspect-ratio:1;border-radius:16px;border:3px solid var(--line);background:var(--sky);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--on-fill);font:700 22px var(--f-display)}
.pc.up{background:var(--surface2)} .pc.dn{background:var(--surface2);opacity:.45;border-color:var(--mint);cursor:default}
.pc svg{width:70%;height:70%}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bx{border:3px solid var(--line);border-radius:20px;background:var(--surface2);padding:10px 4px;display:grid;gap:4px;justify-items:center;cursor:pointer;min-width:0}
.bx svg{width:64px;height:64px} .bx b{font:600 17px var(--f-display);display:flex;align-items:center;gap:4px;min-height:24px}
.bx b svg{width:18px;height:18px}
.bx.pickd{border-color:var(--accent);background:var(--butter);color:var(--on-fill)}
.bx.dim{opacity:.55}
#dial{transform-origin:50px 50px}
.pegrow{fill:var(--muted)}

/* pals */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pal{border:2px solid var(--line);border-radius:18px;background:var(--surface2);padding:8px 6px;text-align:center;cursor:pointer;min-width:0}
.pal.own.r0{border-color:var(--rc0)} .pal.own.r1{border-color:var(--rc1)} .pal.own.r2{border-color:var(--rc2)} .pal.own.r3{border-color:var(--rc3)} .pal.own.r4{border-color:var(--rc4);box-shadow:0 0 0 2px var(--rc4) inset}
.pal .nm{font:600 13px var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal .ct{font:600 11px var(--f-display);color:var(--muted);display:flex;gap:3px;align-items:center;justify-content:center}
.pal .ct svg{width:12px;height:12px}
.rar{font:600 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.rar.r0{color:var(--rc0)} .rar.r1{color:var(--rc1)} .rar.r2{color:var(--rc2)} .rar.r3{color:var(--rc3)} .rar.r4{color:var(--rc4)}
.deal{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:8px;border:2px solid var(--line);border-radius:18px;background:var(--surface2)}
.deal s{color:var(--muted);font-size:12px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{border:2px solid var(--line);border-radius:16px;padding:10px;background:var(--surface2)}
.badge.off{opacity:.55}
.badge b{font:600 14px var(--f-display);display:block}

/* calendar & settings */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font:600 11px var(--f-display);color:var(--muted);text-align:center}
.cd{aspect-ratio:1;border:2px solid transparent;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font:600 14px var(--f-display);cursor:pointer;padding:0;position:relative}
.cd.l1{background:color-mix(in srgb,var(--butter) 55%,var(--surface2))} .cd.l2{background:color-mix(in srgb,var(--mint) 70%,var(--surface2))}
.cd.now{border-color:var(--accent)} .cd.sel{border-color:var(--ink)} .cd.out{opacity:.3}
.cd.dot::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--sky)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.sw{width:52px;height:30px;border-radius:99px;border:2px solid var(--line);background:var(--surface2);position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s}
.sw[aria-checked=true]{background:var(--mint);border-color:var(--mint)} .sw[aria-checked=true]::after{transform:translateX(22px);background:var(--on-fill)}
.rw7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.rw{border:2px solid var(--line);border-radius:12px;background:var(--surface2);padding:6px 0;display:grid;gap:2px;justify-items:center;font:600 10px var(--f-display);color:var(--muted);min-width:0}
.rw svg{width:18px;height:18px} .rw b{font:600 12px var(--f-display);color:var(--ink)}
.rw.cur{background:var(--butter);border-color:var(--butter);color:var(--on-fill)} .rw.cur b{color:var(--on-fill)}
.rw.past{opacity:.5}

/* chrome */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{border:2px solid transparent;background:none;border-radius:16px;padding:6px 2px;display:grid;justify-items:center;gap:2px;color:var(--muted);font:600 12px var(--f-display);cursor:pointer;min-height:54px}
.tab svg{width:24px;height:24px}
.tab[aria-current=page]{background:var(--surface2);border-color:var(--line);color:var(--ink)}
.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:19;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:600 15px var(--f-display);padding:9px 18px;display:flex;gap:10px;cursor:pointer;max-width:90vw;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 16px;font:600 15px var(--f-display);max-width:88vw;text-align:center;animation:rise .25s}

  if(!spend(COST.plinko))return;
  save();updateChips();setBusy(true);plinkoBin=-1;
  var path=[],i;for(i=0;i<8;i++)path.push(Math.random()<.5?1:0);

  if(!own){
    var pr=priceOf(p);
    openModal('<div class="rar r'+p.r+'">'+RAR[p.r]+' - locked</div><div class="pet bigpet">'+petSVG(p,'happy')+'</div><h2>'+esc(p.n)+'</h2>'+(p.r===4?'<p class="muted">A jackpot pal. Win it from the wheel, slots, Plinko edges or the Jackpot Vault.</p><button class="btn alt" data-a="close">Close</button>':'<p class="muted">'+(S.deals.ids.indexOf(id)>=0?'On sale today.':'Buy it with gems.')+'</p><div class="row" style="justify-content:center"><button class="btn alt" data-a="close">Close</button><button class="btn gemb" data-a="buy" data-id="'+id+'"'+(S.gems<pr?' disabled':'')+'>Buy for '+pr+' gems</button></div>'+(S.gems<pr?'<p class="muted small">You need '+(pr-S.gems)+' more gems.</p>':'')));
    return;
  }
  openModal('<div class="rar r'+p.r+'">'+RAR[p.r]+'</div><div class="pet bigpet bob">'+petSVG(p,'happy')+'</div><h2>'+esc(p.n)+'</h2><div class="row" style="justify-content:center"><button class="btn alt" data-a="close">Close</button>'+(S.buddy===id?'':'<button class="btn" data-a="buddy" data-id="'+id+'">Make buddy</button>')+'</div>');
}

/* ---------- calendar and settings ---------- */
function calInner(){
  var first=new Date(cal.y,cal.m,1),days=new Date(cal.y,cal.m+1,0).getDate(),off=first.getDay();
  var h='<div class="row between"><button class="icon-btn" data-a="calnav" data-n="-1" aria-label="Previous month" style="transform:scaleX(-1)">'+ICON.chev+'</button><h2>'+MONTHS[cal.m]+' '+cal.y+'</h2><button class="icon-btn" data-a="calnav" data-n="1" aria-label="Next month">'+ICON.chev+'</button></div><div class="cal">';
  DOWN.forEach(function(d){h+='<div class="h">'+d.charAt(0)+'</div>'});
  for(var i=0;i<off;i++)h+='<div></div>';
  for(var d=1;d<=days;d++){
    var k=cal.y+'-'+pad(cal.m+1)+'-'+pad(d),H=S.hist[k]||{t:0,f:0,c:0},act=H.t+(H.f>0?1:0)+H.c,lv=act>=4||H.t>=3?' l2':(act>=1?' l1':'');
    var due=S.tasks.some(function(t){return t.due===k&&!t.done});
    h+='<button class="cd'+lv+(k===today()?' now':'')+(k===cal.sel?' sel':'')+(due?' dot':'')+'" data-a="calday" data-d="'+k+'" aria-label="'+parseD(k).toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})+'">'+d+'</button>';
  }
  h+='</div>';
  var k2=cal.sel,H2=S.hist[k2]||{t:0,f:0,c:0},wd=parseD(k2).getDay();
  var sched=S.tasks.filter(function(t){return (t.rep&&t.rep.length&&t.rep.indexOf(wd)>=0)||t.due===k2});
  h+='<div class="gap8" style="margin-top:6px"><h3>'+parseD(k2).toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})+(k2===today()?' (today)':'')+'</h3>';
  if(k2<=today()){
    h+='<div class="row between small"><span>Tasks finished</span><b>'+H2.t+'</b></div><div class="row between small"><span>Focus minutes</span><b>'+H2.f+'</b></div><div class="row between small"><span>Care habits</span><b>'+H2.c+'</b></div><div class="row between small"><span>Phone time</span><b>'+(S.screen[k2]!=null?hm(S.screen[k2]):'not logged')+'</b></div>';
  }
  h+='<div class="lab">Scheduled</div>';
  h+=sched.length?sched.slice(0,6).map(function(t){return '<div class="small">'+(t.rep&&t.rep.length?'↻ ':'')+esc(t.t)+' <span class="muted">('+DIFF[t.dk].n+')</span></div>'}).join(''):'<p class="muted small">Nothing scheduled.</p>';
  return h+'</div><button class="btn alt" data-a="close">Close</button>';
}
function openCal(k){
  var d=k?parseD(k):new Date();cal.y=d.getFullYear();cal.m=d.getMonth();cal.sel=k||today();
  openModal(calInner(),'left');
}
function settingsHTML(){
  var h='<h2>Settings</h2><div class="setrow"><span>Sound effects</span><button class="sw" role="switch" aria-checked="'+S.set.sfx+'" aria-label="Sound effects" data-a="sw" data-k="sfx"></button></div><div class="setrow"><span>Music</span><button class="sw" role="switch" aria-checked="'+S.set.music+'" aria-label="Music" data-a="sw" data-k="music"></button></div>';
  h+='<div class="lab">Music style</div><div class="sg" role="group" aria-label="Music style"><button data-a="track" data-k="chill" aria-pressed="'+(S.set.track==='chill')+'">Chill</button><button data-a="track" data-k="arcade" aria-pressed="'+(S.set.track==='arcade')+'">Arcade</button></div>';
  h+='<label class="lab" for="svol">Effects volume</label><input type="range" id="svol" min="0" max="1" step="0.05" value="'+S.set.sv+'"><label class="lab" for="mvol">Music volume</label><input type="range" id="mvol" min="0" max="1" step="0.05" value="'+S.set.mv+'">';
  h+='<div class="lab">Back up or move your progress</div><textarea id="bk" aria-label="Backup text" placeholder="Tap Show backup, copy the text, and paste it into the app on your other device."></textarea><div class="seg"><button class="btn alt sm" data-a="exp">Show backup</button><button class="btn alt sm" data-a="imp">Restore from text</button></div>';
  h+='<p class="muted small">Tip: add this app to your home screen from your browser menu so it opens like a normal app.</p><button class="btn" data-a="close">Done</button>';
  return h;
}

/* ---------- render ---------- */
function render(){
  rollover();
  $('#head').innerHTML=head();updateClock();
  $('#view').innerHTML=({today:vToday,focus:vFocus,care:vCare,play:vPlay,pals:vPals})[tab]();
  var TB=[['today','Today',ICON.tToday],['focus','Focus',ICON.tFocus],['care','Care',ICON.tCare],['play','Play',ICON.tPlay],['pals','Pals',ICON.tPals]];
  $('#tabs').innerHTML='<div class="in">'+TB.map(function(t){return '<button class="tab" data-a="tab" data-t="'+t[0]+'"'+(tab===t[0]?' aria-current="page"':'')+'>'+t[2]+'<span>'+t[1]+'</span></button>'}).join('')+'</div>';
  var mini=$('#mini');
  mini.innerHTML=(S.timer&&tab!=='focus')?'<button class="mini" data-a="tab" data-t="focus"><span id="miniT">'+fmtT(remMs())+'</span><span>'+esc(S.timer.label)+'</span></button>':'';
  setBusy(busy);
}

/* ---------- events ---------- */
var TAPS={tab:1,kind:1,preset:1,dk:1,rep:1,pday:1,ptab:1,pf:1,game:1,cal:1,calday:1,calnav:1,settings:1,pet:1,sw:1,track:1};
function firstGesture(){audio();if(S.set.music)startMusic()}
document.addEventListener('pointerdown',function(e){lastClick={x:e.clientX,y:e.clientY}},true);
document.addEventListener('pointerdown',firstGesture,{once:true});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  var a=b.dataset.a,d=b.dataset;
  if(TAPS[a])sfx('tap');
  switch(a){
    case 'tab':if(d.t==='play'&&tab==='play')game='';tab=d.t;render();window.scrollTo(0,0);break;
    case 'toggleTask':toggleTask(d.id);break;
    case 'delTask':S.tasks=S.tasks.filter(function(x){return x.id!==d.id});save();render();break;
    case 'startTask':var t=S.tasks.filter(function(x){return x.id===d.id})[0];if(t){startTimer({kind:'focus',label:t.t,m:2,taskId:t.id});tab='focus';render()}break;
    case 'dk':dk=+d.i;render();break;
    case 'rep':repMode=d.r;render();break;
    case 'pday':var p=+d.d,ix=pickDays.indexOf(p);if(ix<0)pickDays.push(p);else pickDays.splice(ix,1);render();break;
    case 'habit':toggleHabit(d.id);break;
    case 'preset':fm=+d.m;render();break;
    case 'kind':fk=d.k;fm=fk==='break'?5:25;render();break;
    case 'pause':S.timer.rem=S.timer.end-Date.now();S.timer.run=false;clearInterval(tick_i);save();render();break;
    case 'resume':S.timer.end=Date.now()+S.timer.rem;S.timer.run=true;lock();save();startTick();render();break;
    case 'stop':S.timer=null;clearInterval(tick_i);unlock();save();render();break;
    case 'goal':S.goal=clamp(S.goal+(+d.v),30,600);save();render();break;
    case 'hands':startTimer({kind:'hands',label:'Phone down',m:+d.m});tab='focus';render();break;
    case 'game':game=d.g||'';render();window.scrollTo(0,0);break;
    case 'freeSpin':spinWheel(true);break;
    case 'wheel':spinWheel(false);break;
    case 'slots':spinSlots();break;
    case 'newCard':newCard();break;
    case 'tile':revealTile(+d.i);break;
    case 'revealAll':revealAll();break;
    case 'plinko':dropPlinko();break;
    case 'startHilo':startHilo();break;
    case 'hi':guessHilo(d.up==='1');break;
    case 'cash':cashHilo();break;
    case 'newPair':newPair();break;
    case 'flip':flipPair(+d.i);break;
    case 'newBox':newBox();break;
    case 'pbox':pickBox(+d.i);break;
    case 'vault':spinVault();break;
    case 'ptab':palTab=d.t;render();break;
    case 'pf':palF=+d.f;render();break;
    case 'pet':openPet(d.id);break;
    case 'buy':buyPal(d.id);break;
    case 'capsule':doCapsule(false);break;
    case 'buddy':S.buddy=d.id;save();closeModal();render();toast(PET[d.id].n+' is your buddy now');break;
    case 'finishTask':closeModal();toggleTask(d.id);break;
    case 'close':closeModal();break;
    case 'daily':showDaily();break;
    case 'claimDaily':claimDaily();break;
    case 'chest':openChest();break;
    case 'cal':openCal(d.d||'');break;
    case 'calnav':cal.m+=+d.n;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}cal.sel=cal.y+'-'+pad(cal.m+1)+'-01';openModal(calInner(),'left');break;
    case 'calday':cal.sel=d.d;openModal(calInner(),'left');break;
    case 'mute':
      if(soundOn()){S.set.sfx=false;S.set.music=false;stopMusic()}else{S.set.sfx=true;S.set.music=true;startMusic();sfx('pop')}
      save();render();break;
    case 'settings':openModal(settingsHTML(),'left');break;
    case 'sw':
      S.set[d.k]=!S.set[d.k];
      if(d.k==='music'){if(S.set.music)startMusic();else stopMusic()}
      save();openModal(settingsHTML(),'left');render();break;
    case 'track':S.set.track=d.k;save();if(S.set.music)startMusic();openModal(settingsHTML(),'left');break;
    case 'exp':var bk=$('#bk');if(bk){bk.value=JSON.stringify(S);bk.focus();bk.select();try{navigator.clipboard.writeText(bk.value).then(function(){toast('Backup copied')},function(){})}catch(e){}}break;
    case 'imp':var bt=$('#bk');if(bt&&bt.value.trim())importData(bt.value.trim());else toast('Paste your backup text first');break;
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target.dataset.f;
  if(f==='add')addTask();else if(f==='log')logScreen();else if(f==='start')startFromForm();
});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='taskIn')draft=e.target.value;
  else if(id==='fLabel')flabel=e.target.value;
  else if(id==='dueIn')dueIn=e.target.value;
  else if(id==='fMin'){var v=+e.target.value;if(v>=1&&v<=180)fm=Math.round(v)}
  else if(id==='svol'){S.set.sv=+e.target.value;applyVol();save()}
  else if(id==='mvol'){S.set.mv=+e.target.value;applyVol();save()}
});
$('#modal').addEventListener('click',function(e){if(e.target===this&&!this.querySelector('.capsule')&&!busy)closeModal()});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){stopMusic()}
  else{
    if(S.set.music&&AC)startMusic();
    if(S.timer&&S.timer.run){lock();tick();startTick()}
    dayCheck();
    if(!modalOpen())render();
  }
});
function dayCheck(){
  updateClock();
  if(today()!==curDay){curDay=today();rollover();render();toast('A new day. Fresh start!');setTimeout(showDaily,600)}
}
setInterval(dayCheck,15000);

render();
if(S.timer&&S.timer.run)startTick();
initDb();
setTimeout(showDaily,700);
})();
</script>

<script>if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
